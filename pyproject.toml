[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "anasim-simulator"
dynamic = ["version"]
description = "Real-time anesthesia and physiology simulator for medical education"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Robert Chen", email = "robert.chen@icahn.mssm.edu" },
]
keywords = [
    "anesthesia",
    "medical education",
    "physiology",
    "pharmacokinetics",
    "simulation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-xdist",
    "ruff",
    "twine",
]

[project.urls]
"Homepage" = "https://github.com/robchiral/AnaSim"
"Changelog" = "https://github.com/robchiral/AnaSim/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/robchiral/AnaSim#readme"
"Issues" = "https://github.com/robchiral/AnaSim/issues"
"Releases" = "https://github.com/robchiral/AnaSim/releases"
"Source" = "https://github.com/robchiral/AnaSim"

[project.scripts]
anasim = "anasim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anasim*"]

[tool.setuptools.package-data]
anasim = ["web_assets/*"]

[tool.setuptools.dynamic]
version = { attr = "anasim.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["anasim", "tests"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# Tuple concatenation reads more clearly than unpacking in the breath profiles.
ignore = ["RUF005"]
# En dashes mark printed ranges.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
