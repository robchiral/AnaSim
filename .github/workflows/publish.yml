name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          text = Path("anasim/__init__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"$', text, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read anasim.__version__")
          expected_tag = f"v{match.group(1)}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"Release tag {os.environ['RELEASE_TAG']!r} does not match "
                  f"package version {match.group(1)!r}"
              )
          PY
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check --strict dist/*
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anasim-simulator
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
