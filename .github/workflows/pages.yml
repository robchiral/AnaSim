name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "anasim/**"
      - "web/**"
      - "scripts/build_web.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish; queue the newest push behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build web app
        run: python scripts/build_web.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
